<!doctype html>
<html lang="zh-Hant" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>晨報 · Loop Engineering</title>
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/ops.css" />
  </head>
  <body class="ops">
    <header class="ops-top">
      <a class="ops-brand" href="/"><span class="mark" aria-hidden="true"></span>Loop Engineering</a>
      <nav class="ops-nav" aria-label="頁面">
        <a href="/job.html">新工作</a>
        <a href="/morning.html" aria-current="page">晨報</a>
        <a href="/board.html">任務看板</a>
        <a href="/plans.html">驗證方案</a>
      </nav>
      <span class="grow"></span>
      <span class="ops-who" id="ops-who"></span>
      <button class="icon-btn" id="theme-btn" type="button"></button>
    </header>

    <main class="ops-main">
      <div class="page-head">
        <span class="kicker">晨報 · 昨晚做了什麼</span>
        <h1 id="headline">載入中…</h1>
        <p id="subline"></p>
      </div>
      <div class="row">
        <div class="row grow" id="counts"></div>
        <label class="hint" for="hours">範圍</label>
        <select id="hours" style="font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text)">
          <option value="12">12 小時</option>
          <option value="24" selected>24 小時</option>
          <option value="72">3 天</option>
          <option value="168">7 天</option>
        </select>
        <button class="btn" type="button" id="reload">重新整理</button>
      </div>
      <p class="err" id="page-err" hidden></p>
      <div class="stack" id="list" style="gap: 14px"></div>
    </main>

    <script src="/ops.js"></script>
    <script src="/morning.js"></script>
  </body>
</html>
