<!doctype html>
<html lang="zh-Hant" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>晨報 · Loop Engineering</title>
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/frame.css" />
    <link rel="stylesheet" href="/ops.css" />
  </head>
  <body class="app" data-nav="morning">
    <nav id="app-rail" class="app-rail"><a href="/">回到對話</a></nav>
    <div class="app-main">
      <header class="app-top">
        <h1>晨報</h1>
        <span class="grow"></span>
        <span class="ops-who hide-sm" id="ops-who"></span>
        <select id="hours" aria-label="範圍">
          <option value="12">12 小時內</option>
          <option value="24" selected>24 小時內</option>
          <option value="72">3 天內</option>
          <option value="168">7 天內</option>
        </select>
        <button class="btn" type="button" id="reload">重新整理</button>
      </header>

      <div class="app-scroll">
        <main class="app-body">
          <div class="page-head">
            <span class="kicker">昨晚做了什麼</span>
            <h2 id="headline">載入中…</h2>
            <p id="subline"></p>
          </div>
          <div class="row" id="counts"></div>
          <p class="err" id="page-err" hidden></p>
          <div class="stack" id="list" style="gap: 14px"></div>
        </main>
      </div>
    </div>

    <script src="/ops.js"></script>
    <script src="/morning.js"></script>
    <script type="module" src="/frame-boot.js"></script>
  </body>
</html>
