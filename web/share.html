<!doctype html>
<html lang="zh-Hant" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>分享的對話 · Loop Engineering</title>
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/shell.css" />
  </head>
  <body>
    <header class="topbar-mini">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">
          <span class="brand-name">Loop Engineering</span>
          <span class="brand-sub">分享的對話（唯讀）</span>
        </span>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <strong id="share-title">載入中…</strong>
      <span class="grow"></span>
      <span class="hint" id="share-meta"></span>
    </header>

    <main class="shell share" id="shell-main">
      <section class="convo" id="convo">
        <div class="log" id="log">
          <p class="empty" id="empty">載入中…</p>
        </div>
      </section>
    </main>

    <script type="module" src="/share.js"></script>
  </body>
</html>
