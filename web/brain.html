<!doctype html>
<html lang="zh-Hant" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>知識庫 · Loop Engineering</title>
    <script>
      // Set theme before first paint to avoid a flash of the wrong mode.
      (function () {
        try {
          var m = localStorage.getItem('loop_mode');
          if (m !== 'light' && m !== 'dark') {
            m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-mode', m);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">
          <strong class="brand-name">Loop Engineering</strong>
          <span class="brand-sub">知識庫</span>
        </span>
      </div>

      <div class="controls">
        <a class="btn" href="/">← 看板</a>
        <a class="btn" href="/metrics.html">儀表板</a>
        <button id="theme-btn" class="btn icon-btn" type="button" title="切換佈景" aria-label="切換佈景"></button>
        <button id="graph-btn" class="btn" type="button">🕸 圖譜</button>
        <button id="capture-btn" class="btn" type="button">📥 擷取</button>
        <button id="relate-btn" class="btn" type="button">🔗 推斷關聯</button>
        <button id="new-node-btn" class="btn primary" type="button">＋ 新增</button>
      </div>
    </header>

    <main class="brain" aria-live="polite">
      <div class="brain-toolbar">
        <input id="search-input" class="brain-search" type="search" placeholder="搜尋知識…" autocomplete="off" />
        <div id="kind-chips" class="chip-row" role="group" aria-label="kind 篩選"></div>
        <div id="status-chips" class="chip-row" role="group" aria-label="狀態篩選"></div>
      </div>

      <section id="graph-panel" class="graph-panel" hidden>
        <div class="graph-header">
          <span id="graph-title" class="graph-title"></span>
          <span id="graph-counts" class="graph-counts"></span>
          <div class="graph-header-actions">
            <label class="graph-density-label">展示程度
              <input id="graph-density" type="range" min="1" max="10" value="5" />
            </label>
            <label class="graph-depth-label">展開跳數
              <input id="graph-depth" type="number" min="1" max="6" value="2" />
            </label>
            <button id="graph-zoom-out" class="btn sm icon-btn" type="button" title="縮小" aria-label="縮小">－</button>
            <button id="graph-zoom-in" class="btn sm icon-btn" type="button" title="放大" aria-label="放大">＋</button>
            <button id="graph-fullscreen" class="btn sm icon-btn" type="button" title="全螢幕" aria-label="全螢幕">⛶</button>
            <button id="graph-reset" class="btn sm" type="button">重置視圖</button>
            <button id="graph-close" class="btn sm" type="button">關閉</button>
          </div>
        </div>

        <div class="graph-filters">
          <div id="graph-kind-chips" class="chip-row" role="group" aria-label="圖譜 kind 篩選"></div>
          <div id="graph-source-chips" class="chip-row" role="group" aria-label="圖譜來源篩選"></div>
          <div class="graph-filter-row">
            <input id="graph-tag-filter" type="search" placeholder="依標籤過濾…" autocomplete="off" />
            <input id="graph-scope-filter" type="search" placeholder="依 scope 過濾…" autocomplete="off" />
            <label class="graph-doc-toggle"><input id="graph-show-documents" type="checkbox" checked /> 顯示文件節點</label>
          </div>
        </div>

        <div class="graph-body">
          <aside id="graph-category-tree" class="graph-category-tree" aria-label="分類樹" hidden></aside>

          <div class="graph-main">
            <div id="graph-empty" class="empty" hidden>此節點尚無關聯</div>
            <div class="graph-canvas-wrap">
              <canvas id="graph-canvas" class="graph-canvas" width="880" height="560"></canvas>
              <div id="graph-tooltip" class="graph-tooltip" hidden></div>
            </div>
            <p class="graph-hint">拖曳空白處平移、滾輪縮放、拖曳節點調整位置、懸停高亮鄰居、點一下節點聚焦展開並查看詳情。</p>
          </div>

          <aside id="graph-detail-panel" class="graph-detail-panel" hidden>
            <div class="graph-detail-header">
              <span id="graph-detail-title" class="graph-detail-title"></span>
              <button id="graph-detail-close" class="btn sm icon-btn" type="button" title="關閉詳情" aria-label="關閉詳情">×</button>
            </div>
            <div id="graph-detail-body" class="graph-detail-body"></div>
          </aside>
        </div>
      </section>

      <section id="draft-edges-panel" class="draft-edges-panel" hidden>
        <div class="settings-group">草稿關聯（待審核）</div>
        <div id="draft-edges-list" class="node-list"></div>
      </section>

      <div id="node-list" class="node-list"></div>
    </main>

    <dialog id="node-dialog">
      <form id="node-form" method="dialog">
        <h3 id="node-dialog-title">新增知識</h3>
        <input type="hidden" name="id" />
        <label>Title <span class="req">*</span><input name="title" required autocomplete="off" /></label>
        <label>Body <textarea name="body" rows="4"></textarea></label>
        <div class="row">
          <label>Kind
            <select name="kind">
              <option value="environment">environment</option>
              <option value="project">project</option>
              <option value="constraint">constraint</option>
              <option value="preference">preference</option>
              <option value="tech">tech</option>
              <option value="fact" selected>fact</option>
              <option value="person">person</option>
              <option value="repo">repo</option>
            </select>
          </label>
          <label>Weight <input name="weight" type="number" min="1" max="5" value="3" /></label>
        </div>
        <label>Scope（global / repo:&lt;path&gt; / env:&lt;name&gt;）
          <input name="scope" placeholder="global" autocomplete="off" />
        </label>
        <label>Tags（逗號分隔） <input name="tags" autocomplete="off" /></label>

        <div id="edge-section" class="edge-section" hidden>
          <div class="settings-group">相關連結</div>
          <div id="edge-list" class="edge-list"></div>
          <div class="row edge-add-row">
            <label>連到
              <input name="edge_dst" list="node-title-list" autocomplete="off" />
              <datalist id="node-title-list"></datalist>
            </label>
            <label>關係
              <select name="edge_relation">
                <option value="related" selected>related</option>
                <option value="runs-on">runs-on</option>
                <option value="constrains">constrains</option>
                <option value="deployed-at">deployed-at</option>
                <option value="uses">uses</option>
                <option value="part-of">part-of</option>
              </select>
            </label>
            <button type="button" id="edge-add-btn" class="btn sm">加連結</button>
          </div>
        </div>

        <p class="settings-err" id="node-err" hidden></p>
        <menu>
          <button class="btn" type="button" id="node-cancel">取消</button>
          <button value="save" class="btn primary" id="node-save" type="submit">儲存</button>
        </menu>
      </form>
    </dialog>

    <dialog id="capture-dialog">
      <form id="capture-form" method="dialog">
        <h3>擷取到 SSoT vault</h3>
        <p class="muted">寫一則 markdown 筆記進已登錄的 SSoT vault 並立即索引，可在 <code>loop_search</code> 直接搜到；跟上面「＋ 新增」的策展知識節點是分開的兩層（見操作說明 SSoT 章節）。</p>
        <label>標題（留白＝取內文第一句） <input name="title" autocomplete="off" /></label>
        <label>內文 <span class="req">*</span><textarea name="body" rows="6" required></textarea></label>
        <label>Tags（逗號分隔） <input name="tags" autocomplete="off" /></label>
        <p class="banner" id="capture-msg" hidden></p>
        <menu>
          <button class="btn" type="button" id="capture-cancel">取消</button>
          <button value="save" class="btn primary" id="capture-save" type="submit">寫入</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="/brain.js"></script>
  </body>
</html>
