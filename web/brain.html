<!doctype html>
<html lang="zh-Hant" data-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>知識 · Loop Engineering</title>
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/frame.css" />
    <link rel="stylesheet" href="/knowledge.css" />
  </head>
  <body class="app brain-page" data-nav="brain">
    <nav id="app-rail" class="app-rail"><a href="/">回到對話</a></nav>
    <div class="app-main">
      <header class="app-top">
        <h1>知識星圖</h1>
        <nav class="ktabs" role="tablist" aria-label="知識">
          <button type="button" role="tab" data-ktab="profile" aria-selected="true">Repo 檔案</button>
          <button type="button" role="tab" data-ktab="drafts" aria-selected="false">待核可</button>
          <button type="button" role="tab" data-ktab="diag" aria-selected="false">機況診斷</button>
          <button type="button" role="tab" data-ktab="graph" aria-selected="false">全覽</button>
        </nav>
        <span id="graph-title" class="top-sub hide-sm graph-only" hidden>整體知識圖譜</span>
        <span class="grow"></span>
        <span class="ops-who hide-sm" id="ops-who"></span>
        <button id="capture-btn" class="btn graph-only" type="button" hidden>擷取</button>
        <button id="relate-btn" class="btn graph-only" type="button" hidden>推斷關聯</button>
        <button id="new-node-btn" class="btn primary graph-only" type="button" hidden>＋ 新增</button>
        <button id="manage-toggle" class="btn graph-only" type="button" aria-controls="manage-drawer" hidden>清單</button>
      </header>

      <!-- Repo 檔案: what a local model is told about a repo (web/knowledge-profile.js) -->
      <main id="profile-stage" class="kstage">
        <div class="kp-bar">
          <label class="kp-repo-l">Repo <select id="kp-repo" aria-label="Repo"></select></label>
          <span id="kp-status" class="kp-status"></span>
          <span class="grow"></span>
          <button id="kp-infer" class="btn" type="button" title="本地模型整理模組摘要、寫法規則、陷阱與參數意義（草稿，要核可）">本地模型補充</button>
          <button id="kp-run" class="btn primary" type="button">重新分析</button>
        </div>
        <div id="kp-body"></div>
      </main>

      <!-- 待核可: drafts from the local model and from runs, across repos -->
      <main id="drafts-stage" class="kstage" hidden>
        <p class="kp-lead">模型推論與從任務學到的知識要人核可才會交給模型；確定的事實（從專案檔讀到的）不用核可。</p>
        <div id="drafts-body"></div>
      </main>

      <!-- 機況診斷: what a machine produced → events → code → past cases (web/diag.js) -->
      <main id="diag-stage" class="kstage" hidden>
        <div id="diag-body"></div>
      </main>

      <!-- The graph fills the content area: a dark canvas with floating glass chrome over it
           (filters on the left, view controls bottom-right). The curated-node management UI
           lives in a slide-in drawer (清單). -->
      <main id="graph-stage" class="graph-stage" hidden>
        <canvas id="graph-canvas" class="graph-canvas" width="1280" height="800"></canvas>
        <!-- 3D view: same graph, WebGL. Hidden until 立體 is switched on (web/brain3d.js). -->
        <canvas id="graph-canvas-3d" class="graph-canvas" hidden></canvas>
        <div id="graph-labels-3d" class="g3d-labels" hidden aria-hidden="true"></div>
        <div id="graph-tooltip" class="graph-tooltip" hidden></div>
        <div id="graph-empty" class="graph-empty" hidden>知識庫目前沒有節點</div>

        <!-- left dock: category legend + filters -->
        <aside class="gdock" id="gdock">
          <div class="gdock-head">
            <span class="gdock-title">分類 · 星系</span>
            <button id="dock-collapse" class="gdock-collapse" type="button" title="收合面板" aria-label="收合面板">‹</button>
          </div>
          <div class="gdock-scroll">
            <div id="graph-legend" class="glegend" role="group" aria-label="分類圖例"></div>
            <div class="gdock-group">
              <div class="gdock-label">知識類型</div>
              <div id="graph-kind-chips" class="chip-row" role="group" aria-label="知識類型篩選"></div>
            </div>
            <div class="gdock-group">
              <div class="gdock-label">來源</div>
              <div id="graph-source-chips" class="chip-row" role="group" aria-label="來源篩選"></div>
            </div>
            <div class="gdock-group">
              <input id="graph-tag-filter" class="gfield" type="search" placeholder="依標籤過濾…" autocomplete="off" />
              <input id="graph-scope-filter" class="gfield" type="search" placeholder="依 scope 過濾…" autocomplete="off" />
              <label class="gcheck"><input id="graph-show-documents" type="checkbox" checked /> 顯示文件節點</label>
            </div>
          </div>
        </aside>

        <!-- bottom-right view controls -->
        <div class="gcontrols">
          <label class="gdepth">展開跳數<input id="graph-depth" type="number" min="1" max="6" value="2" /></label>
          <button id="graph-zoom-out" class="gbtn icon" type="button" title="縮小" aria-label="縮小">－</button>
          <button id="graph-zoom-in" class="gbtn icon" type="button" title="放大" aria-label="放大">＋</button>
          <button id="graph-3d" class="gbtn" type="button" aria-pressed="false" title="平面／立體切換">立體</button>
          <button id="graph-reset" class="gbtn" type="button">重置視圖</button>
        </div>

        <p class="ghint">拖曳平移 · 滾輪縮放 · 拖曳節點 · 懸停高亮鄰居 · 點節點聚焦展開</p>
      </main>
    </div>

    <!-- management drawer: curated-node list, search, draft-edge review -->
    <div id="drawer-scrim" class="drawer-scrim" hidden></div>
    <aside id="manage-drawer" class="manage-drawer" hidden aria-label="知識清單管理">
      <div class="drawer-head">
        <strong>知識清單</strong>
        <button id="manage-close" class="gbtn icon" type="button" title="關閉清單" aria-label="關閉清單">✕</button>
      </div>
      <div class="drawer-body">
        <input id="search-input" class="brain-search" type="search" placeholder="搜尋知識…" autocomplete="off" />
        <div id="kind-chips" class="chip-row" role="group" aria-label="kind 篩選"></div>
        <div id="status-chips" class="chip-row" role="group" aria-label="狀態篩選"></div>

        <section id="draft-edges-panel" class="draft-edges-panel" hidden>
          <div class="settings-group">草稿關聯（待審核）</div>
          <div id="draft-edges-list" class="node-list"></div>
        </section>

        <div id="node-list" class="node-list"></div>
      </div>
    </aside>

    <dialog id="node-dialog">
      <form id="node-form" method="dialog">
        <h3 id="node-dialog-title">新增知識</h3>
        <input type="hidden" name="id" />
        <label>Title <span class="req">*</span><input name="title" required autocomplete="off" /></label>
        <label>Body <textarea name="body" rows="4"></textarea></label>
        <div class="row">
          <label>Kind
            <select name="kind">
              <option value="environment">環境 (environment)</option>
              <option value="project">專案 (project)</option>
              <option value="constraint">限制 (constraint)</option>
              <option value="preference">偏好 (preference)</option>
              <option value="tech">技術 (tech)</option>
              <option value="fact" selected>事實 (fact)</option>
              <option value="person">人物 (person)</option>
              <option value="repo">儲存庫 (repo)</option>
            </select>
          </label>
          <label>Weight <input name="weight" type="number" min="1" max="5" value="3" /></label>
        </div>
        <label>Scope（global / repo:&lt;path&gt; / env:&lt;name&gt;）
          <input name="scope" placeholder="global" autocomplete="off" />
        </label>
        <label>Tags（逗號分隔） <input name="tags" autocomplete="off" /></label>

        <div id="edge-section" class="edge-section" hidden>
          <div class="settings-group">相關連結</div>
          <div id="edge-list" class="edge-list"></div>
          <div class="row edge-add-row">
            <label>連到
              <input name="edge_dst" list="node-title-list" autocomplete="off" />
              <datalist id="node-title-list"></datalist>
            </label>
            <label>關係
              <select name="edge_relation">
                <option value="related" selected>related</option>
                <option value="runs-on">runs-on</option>
                <option value="constrains">constrains</option>
                <option value="deployed-at">deployed-at</option>
                <option value="uses">uses</option>
                <option value="part-of">part-of</option>
              </select>
            </label>
            <button type="button" id="edge-add-btn" class="btn sm">加連結</button>
          </div>
        </div>

        <p class="settings-err" id="node-err" hidden></p>
        <menu>
          <button class="btn" type="button" id="node-cancel">取消</button>
          <button value="save" class="btn primary" id="node-save" type="submit">儲存</button>
        </menu>
      </form>
    </dialog>

    <dialog id="capture-dialog">
      <form id="capture-form" method="dialog">
        <h3>擷取到 SSoT vault</h3>
        <p class="muted">寫一則 markdown 筆記進已登錄的 SSoT vault 並立即索引，可在 <code>loop_search</code> 直接搜到；跟上面「＋ 新增」的策展知識節點是分開的兩層（見操作說明 SSoT 章節）。</p>
        <label>標題（留白＝取內文第一句） <input name="title" autocomplete="off" /></label>
        <label>內文 <span class="req">*</span><textarea name="body" rows="6" required></textarea></label>
        <label>Tags（逗號分隔） <input name="tags" autocomplete="off" /></label>
        <p class="banner" id="capture-msg" hidden></p>
        <menu>
          <button class="btn" type="button" id="capture-cancel">取消</button>
          <button value="save" class="btn primary" id="capture-save" type="submit">寫入</button>
        </menu>
      </form>
    </dialog>

    <script src="/ops.js"></script>
    <script type="module" src="/knowledge-profile.js"></script>
    <script type="module" src="/diag.js"></script>
    <script type="module" src="/brain.js"></script>
    <script type="module" src="/frame-boot.js"></script>
  </body>
</html>
