<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loop Engineering — 報告 Deck</title>
<link rel="stylesheet" href="/report.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- ===== Control rail ===== -->
    <aside class="rail">
      <div class="rail-inner">
        <div class="brand">
          <div class="brand-mark"></div>
          <div>
            <div class="brand-name">報告 Deck</div>
            <div class="brand-sub">Loop Engineering</div>
          </div>
        </div>

        <label class="fld">
          <span>用一句話描述你要的報告</span>
          <textarea id="f-description" placeholder="例：大型AOI PR 最新進度 一頁綜覽" required></textarea>
        </label>

        <h2 class="sec">選老闆範本</h2>
        <div class="persona-grid" id="persona-grid">
          <button type="button" class="persona on" data-p="auto" data-template="">
            <div class="ptop"><span class="dot"></span><span class="pn">自動挑選</span></div>
            <span class="pd">依描述自動配範本</span>
          </button>
          <button type="button" class="persona" data-p="plant" data-template="plant-manager-onepage">
            <div class="ptop"><span class="dot"></span><span class="pn">廠長</span></div>
            <span class="pd">一頁綜覽 · 只看紅燈</span>
          </button>
          <button type="button" class="persona" data-p="manager" data-template="manager-pr-weekly">
            <div class="ptop"><span class="dot"></span><span class="pn">經理</span></div>
            <span class="pd">PR 週報 · 交期/簽核</span>
          </button>
          <button type="button" class="persona" data-p="pm" data-template="pm-detailed">
            <div class="ptop"><span class="dot"></span><span class="pn">PM</span></div>
            <span class="pd">逐項細節 · 卡點</span>
          </button>
        </div>

        <label class="fld">
          <span>或選其他範本</span>
          <select id="f-template"><option value="">（自動挑選 / 內建預設）</option></select>
        </label>

        <label class="fld">
          <span>專案（選填，不填則從描述解析）</span>
          <input id="f-project" type="text" placeholder="不填則從描述解析" autocomplete="off" />
        </label>

        <label class="save-row"><input id="f-save" type="checkbox" /> 同時存檔（報告＋資料＋圖表到 git 分類目錄）</label>

        <button id="gen-btn" class="btn primary block" type="button">產生報告</button>
        <p class="note" id="note"></p>

        <h2 class="sec">匯出</h2>
        <div class="export-grid">
          <button id="print-btn" class="btn" type="button" disabled title="以瀏覽器列印，另存為 PDF">PDF</button>
          <button id="png-btn"   class="btn" type="button" disabled title="把目前這張投影片存成 PNG">PNG 圖檔</button>
          <button id="html-btn"  class="btn" type="button" disabled title="下載可離線開啟的單檔 HTML Deck">HTML</button>
          <button id="pptx-btn"  class="btn" type="button" disabled title="每張投影片一頁的 PowerPoint">PPTX</button>
        </div>

        <p class="hint">也可用 CLI <code>loop report generate "…" --template …</code> 或 MCP <code>loop_report</code>。資料來源為 OpenProject／知識庫。</p>

        <div class="rail-links">
          <a href="/">← 看板</a>
          <a href="/help.html">說明</a>
        </div>
      </div>
    </aside>

    <!-- ===== Deck stage ===== -->
    <main class="stage" id="stage">
      <button class="rail-toggle" id="rail-toggle" type="button" title="收合／展開側欄" aria-label="收合或展開側欄">‹</button>
      <div class="deck-viewport" id="viewport">
        <div class="empty" id="empty">
          <div class="glyph">🗂️</div>
          <div class="big">產生一份滿版 16:9 專案報告</div>
          <div class="sub">在左側輸入一句描述、挑一個老闆範本，按「產生報告」。系統會即時抓 OpenProject 資料，排成一份可翻頁、可匯出 PDF／PNG／HTML／PPTX 的簡報。</div>
        </div>
      </div>
      <div class="deck-ui" id="deck-ui" hidden>
        <div class="deck-dots" id="deck-dots"></div>
        <div class="deck-nav">
          <button class="deck-btn" id="deck-prev" type="button" aria-label="上一頁">‹</button>
          <span class="deck-count" id="deck-count">0 / 0</span>
          <button class="deck-btn" id="deck-next" type="button" aria-label="下一頁">›</button>
        </div>
      </div>
    </main>
  </div>
  <script src="/report.js"></script>
</body>
</html>
