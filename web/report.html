<!doctype html>
<html lang="zh-Hant" data-mode="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loop Engineering — 報告</title>
<script>
  (function () {
    try {
      var m = localStorage.getItem('loop_mode');
      if (m !== 'light' && m !== 'dark')
        m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-mode', m);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="/styles.css" />
<style>
  main.report { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 22px clamp(16px, 4vw, 40px); max-width: 900px; margin: 0 auto; width: 100%; }
  .report .lead { color: var(--text-2); font-size: 14px; margin: 0 0 18px; }
  .rpt-form { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow-1); margin-bottom: 18px; }
  .rpt-form label { display: block; margin: 10px 0; font-size: 13.5px; }
  .rpt-form textarea, .rpt-form input, .rpt-form select {
    width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid var(--border-2);
    border-radius: var(--r-sm); background: var(--surface-2); color: var(--text); font: inherit; resize: vertical;
  }
  .rpt-form textarea { min-height: 70px; }
  .rpt-actions { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
  .rpt-note { font-size: 13px; margin-top: 10px; }
  .rpt-note.danger { color: var(--danger); }
  .rpt-output-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px 24px; box-shadow: var(--shadow-1); }
  .rpt-output-wrap:empty { display: none; }
  .rpt-output h2 { font-size: 19px; margin: 0 0 10px; }
  .rpt-output h3 { font-size: 15.5px; margin: 18px 0 8px; }
  .rpt-output h3:first-child { margin-top: 0; }
  .rpt-output p { font-size: 13.5px; line-height: 1.6; margin: 6px 0; color: var(--text); }
  .rpt-output ul { margin: 4px 0 10px; padding-left: 22px; }
  .rpt-output li { font-size: 13.5px; line-height: 1.6; margin: 3px 0; }
  .rpt-output pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; overflow-x: auto; font-size: 12.5px; }
  .rpt-meta { margin-bottom: 14px; }
  .f-save-label { display: flex !important; align-items: center; gap: 6px; }
  .f-save-label input { width: auto !important; margin: 0 !important; }

  .mmd-block { margin: 14px 0 20px; border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px; background: var(--surface-2); }
  .mmd-actions { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .mmd-render { overflow-x: auto; }
  .mmd-render svg { max-width: 100%; height: auto; }
  .mmd-fallback { white-space: pre-wrap; word-break: break-word; }

  @media print {
    .topbar, .rpt-form, .no-print { display: none !important; }
    main.report { max-width: none; padding: 0; overflow: visible; }
    .rpt-output-wrap { box-shadow: none; border: none; padding: 0; }
    @page { size: A4; margin: 14mm; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark"></div>
      <div class="brand-text"><span class="brand-name">報告</span><span class="brand-sub">Loop Engineering</span></div>
    </div>
    <span class="spacer" style="margin-left:auto"></span>
    <div class="controls">
      <a class="btn" href="/">← 看板</a>
      <a class="btn" href="/help.html">說明</a>
      <button id="theme-btn" class="btn icon-btn" type="button" title="切換佈景">☾</button>
    </div>
  </header>
  <main class="report">
    <p class="lead">用一句描述產生 OpenProject 專案報告，可選擇套用老闆範本（廠長一頁綜覽／經理 PR 週報／PM 詳細進度）。也可用 CLI <code>loop report generate "…" --template …</code> 或 MCP <code>loop_report</code>。</p>

    <div class="rpt-form">
      <label>描述<textarea id="f-description" placeholder="例：大型AOI PR 最新進度 one page" required></textarea></label>
      <label>範本（選填，不選則自動挑選或用內建預設）
        <select id="f-template"><option value="">（自動 / 內建預設）</option></select>
      </label>
      <label>專案（選填）<input id="f-project" type="text" placeholder="不填則從描述解析" autocomplete="off" /></label>
      <label class="f-save-label"><input id="f-save" type="checkbox" /> 同時存檔（報告 + 資料 + 圖表存到 git 分類目錄）</label>
      <div class="rpt-actions">
        <button id="gen-btn" class="btn primary" type="button">產生報告</button>
        <button id="print-btn" class="btn no-print" type="button" hidden>列印 / 存 PDF</button>
      </div>
      <p class="rpt-note" id="rpt-note" hidden></p>
    </div>

    <div class="rpt-output-wrap">
      <div class="meta rpt-meta" id="rpt-meta-chips"></div>
      <div class="rpt-output" id="rpt-output"></div>
    </div>
  </main>
  <script src="/report.js"></script>
</body>
</html>
