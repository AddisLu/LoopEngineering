<!doctype html>
<html lang="zh-Hant" data-mode="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loop Engineering — 交付 Pipelines</title>
<script>
  (function () {
    try {
      var m = localStorage.getItem('loop_mode');
      if (m !== 'light' && m !== 'dark')
        m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-mode', m);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="/styles.css" />
<style>
  main.pipes { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 22px clamp(16px, 4vw, 40px); max-width: 1000px; margin: 0 auto; width: 100%; }
  .pipes .lead { color: var(--text-2); font-size: 14px; margin: 0 0 18px; }
  .pipe-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow-1); margin-bottom: 16px; }
  .pipe-card h3 { margin: 0 0 3px; font-size: 16px; }
  .pipe-card .desc { color: var(--text-3); font-size: 13px; margin: 0 0 10px; }
  .stages { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .stage { display: inline-flex; gap: 6px; align-items: center; padding: 5px 10px; border: 1px solid var(--border-2); border-radius: 999px; font-size: 12.5px; background: var(--surface-2); }
  .stage .n { font-variant-numeric: tabular-nums; color: var(--text-3); }
  .stage .meta { color: var(--text-3); font-family: var(--mono); font-size: 11.5px; }
  .arrow { color: var(--text-3); }
  dialog form label { display: block; margin: 10px 0; font-size: 13.5px; }
  dialog form input, dialog form select { width: 100%; margin-top: 4px; padding: 7px 9px; border: 1px solid var(--border-2); border-radius: var(--r-sm); background: var(--surface-2); color: var(--text); font: inherit; }
  dialog menu { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 0 0; margin: 0; }
  .run-note { font-size: 13px; color: var(--ok); margin-top: 10px; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark"></div>
      <div class="brand-text"><span class="brand-name">Pipelines</span><span class="brand-sub">Loop Engineering</span></div>
    </div>
    <span class="spacer" style="margin-left:auto"></span>
    <div class="controls">
      <a class="btn" href="/">← 看板</a>
      <a class="btn" href="/help.html">說明</a>
      <button id="theme-btn" class="btn icon-btn" type="button" title="切換佈景">☾</button>
    </div>
  </header>
  <main class="pipes">
    <p class="lead">交付 pipeline 模板：一鍵把一個目標展開成多階段 <code>depends_on</code> 任務鏈（每階段複用 verify 模式與部署）。也可用 CLI <code>loop pipeline run &lt;name&gt; --goal … --repo … --base main</code> 或 MCP <code>loop_run_pipeline</code>。</p>
    <div id="list"></div>
  </main>

  <dialog id="run-dialog">
    <form id="run-form" method="dialog">
      <h3 id="run-title">執行 pipeline</h3>
      <label>目標 (goal) <span style="color:var(--danger)">*</span><input name="goal" required autocomplete="off" placeholder="這條 pipeline 要達成什麼" /></label>
      <label>Repo 路徑 <span style="color:var(--danger)">*</span><input name="repo_path" required autocomplete="off" placeholder="/path/to/repo" /></label>
      <label>Base 分支 <input name="base_branch" value="main" autocomplete="off" /></label>
      <label>Environment（選填，供 deploy 階段用）<input name="environment" autocomplete="off" placeholder="home / company" /></label>
      <p class="run-note" id="run-note" hidden></p>
      <menu>
        <button class="btn" type="button" id="run-cancel">取消</button>
        <button class="btn primary" id="run-go" value="go" type="submit">建立並排程</button>
      </menu>
    </form>
  </dialog>
  <script src="/pipelines.js"></script>
</body>
</html>
