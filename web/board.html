<!doctype html>
<html lang="zh-Hant" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>總覽 · Loop Engineering</title>
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/frame.css" />
    <style>
      /* the classic columns live on as the 看板 view */
      #view-kanban { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
      #view-kanban .board { flex: 1 1 auto; min-height: 0; }
      #view-kanban .card .btn { display: inline-block; border-radius: 999px; }
      #view-list { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
      .views { flex: 1 1 auto; min-height: 0; display: flex; }
      .top-search { width: 280px; height: 36px; padding: 0 10px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-2); border-radius: 9px; background: var(--surface-2); color: var(--text-2); }
      .top-search svg { width: 16px; height: 16px; flex: 0 0 auto; }
      .top-search input { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 13px; color: var(--text); outline: none; }
      .sched { display: inline-flex; align-items: center; gap: 8px; }
      #sched-state .s-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st-running); display: inline-block; }
      #sched-state.paused .s-dot { background: var(--st-blocked); }
      #sched-state { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
      #local-chip[data-state="warn"] { color: var(--warn); }
      #local-chip[data-state="danger"] { color: var(--danger); }
      #conn { display: inline-flex; align-items: center; gap: 6px; }
      #conn .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
      #conn.live .conn-dot { background: var(--st-running); }
      #conn.down .conn-dot { background: var(--danger); }
      .more-wrap { position: relative; }
      #more-menu { right: 0; top: 42px; }
      .loglist { position: absolute; left: 12px; bottom: 48px; z-index: 20; width: min(640px, 90vw); max-height: 50vh; overflow: auto; padding: 8px; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: 12px; box-shadow: var(--shadow-pop); font-size: 13px; }
      .loglist div { display: flex; gap: 10px; padding: 5px 8px; border-radius: 6px; }
      .loglist div:hover { background: var(--surface-sunk); }
      .loglist .ts { font-family: var(--mono); font-size: 12px; color: var(--text-2); }
      .canvas-wrap { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; }
      .fnode .ic svg { pointer-events: none; }
      @media (max-width: 820px) {
        .views { flex-direction: column; overflow-y: auto; }
        /* phones: what needs you first, then the list of work */
        .views > .inbox { order: -1; flex: 0 0 auto; overflow: visible; }
        #view-list { flex: 0 0 auto; overflow: visible; }
        .canvas-wrap { min-height: 360px; }
        .top-search { display: none; }
        #view-switch button[data-view="kanban"] { display: none; }
      }
    </style>
  </head>
  <body class="app">
    <nav id="rail"><a href="/">回到對話</a></nav>
    <div class="app-main">
      <header class="app-top">
        <h1>總覽</h1>
        <div class="seg" role="group" aria-label="檢視方式" id="view-switch">
          <button type="button" data-view="canvas" aria-pressed="true">流程圖</button>
          <button type="button" data-view="list" aria-pressed="false">清單</button>
          <button type="button" data-view="kanban" aria-pressed="false">看板</button>
        </div>
        <span class="grow"></span>
        <label class="top-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4.5a6.5 6.5 0 1 0 0 13a6.5 6.5 0 1 0 0-13" /><path d="M16 16l4.5 4.5" /></svg><input type="search" id="search" aria-label="搜尋任務" placeholder="搜尋任務、模型、repo" /></label>
        <span class="chip-s hide-sm" id="local-chip" data-state="ok" hidden title="本地模型（vLLM）狀態">–</span>
        <span id="self-update-badge" class="chip-s info" hidden>引擎更新排隊中</span>
        <span class="sched hide-sm">
          <span id="sched-state" class="state"><span class="s-dot"></span><span class="s-text">–</span></span>
          <button id="pause-btn" class="btn sm" type="button">暫停排程</button>
        </span>
        <div class="more-wrap">
          <button class="btn icon" id="more-btn" type="button" aria-label="更多" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7" /><circle cx="12" cy="12" r="1.7" /><circle cx="19" cy="12" r="1.7" /></svg></button>
          <div class="menu-pop" id="more-menu" role="menu" hidden>
            <button id="settings-btn" type="button" role="menuitem">排程設定</button>
            <button id="prune-btn" type="button" role="menuitem">清理結束的任務</button>
            <hr />
            <button id="new-btn" type="button" role="menuitem">新增單一任務（進階）</button>
            <a href="/plans.html" role="menuitem">驗證方案</a>
            <a href="/morning.html" role="menuitem">晨報</a>
          </div>
        </div>
        <a class="btn primary" href="/flow.html#new">＋ 新工作流程</a>
      </header>

      <div class="kpis" id="kpis"></div>

      <div class="views">
        <div class="canvas-wrap" id="view-canvas"><div id="canvas" style="flex: 1 1 auto; display: flex; min-width: 0"></div></div>
        <div id="view-list" hidden>
          <div class="filters" id="list-filters"></div>
          <div class="tbl-wrap"><table class="tbl" id="list-table"></table></div>
        </div>
        <div id="view-kanban" hidden>
          <section id="pipeline-strip" class="pipeline-strip" aria-live="polite" hidden></section>
          <main id="board" class="board" aria-live="polite"></main>
        </div>
        <aside class="inbox" id="inbox" aria-label="需要你處理"></aside>
      </div>

      <div class="logbar" id="logbar">
        <button class="btn sm" id="log-toggle" type="button" aria-expanded="false">紀錄</button>
        <span class="ts" id="log-ts"></span>
        <span class="last" id="log-last">等第一筆更新…</span>
        <span class="grow" style="flex: 1 1 auto"></span>
        <span id="conn" class="conn connecting" title="即時連線狀態" role="status"><span class="conn-dot"></span><span class="conn-text">連線中</span></span>
      </div>
      <div class="loglist" id="log-list" hidden></div>
    </div>

    <dialog id="new-dialog">
      <form method="dialog" id="new-form">
        <h3>新增 task <button id="voice-btn" class="btn icon-btn" type="button" title="語音輸入" aria-label="語音輸入">🎤</button></h3>
        <p class="dialog-hint" id="voice-status" hidden></p>
        <label>Title <span class="req">*</span><input name="title" required autocomplete="off" /></label>
        <label>Goal <span class="req">*</span><input name="goal" required autocomplete="off" /></label>
        <label>Plan (.md/.html 或 URL) <input name="plan_ref" placeholder="./plan.md or https://…" autocomplete="off" /></label>
        <div class="row">
          <label>Tool
            <select name="coding_tool"><option>claude-code</option><option>mock</option><option>generic</option><option>plan</option><option>deploy</option></select>
          </label>
          <label>Complexity
            <select name="complexity"><option>S</option><option selected>M</option><option>L</option></select>
          </label>
          <label>Priority <input name="priority" type="number" value="2" /></label>
        </div>
        <label>Model（留空＝用全域預設）
          <select name="model">
            <option value="">（全域預設）</option>
            <option value="sonnet">sonnet</option>
            <option value="haiku">haiku</option>
            <option value="opus">opus</option>
            <option value="fable-5">fable-5</option>
            <optgroup label="本地模型（vLLM，不耗 token）" id="model-local-group" hidden></optgroup>
          </select>
        </label>
        <label>Verify steps (逗號分隔) <input name="verification_steps" placeholder="npm run lint, npm test" autocomplete="off" /></label>
        <div class="settings-group">Verify mode</div>
        <div class="chk-row">
          <label class="chk"><input type="checkbox" name="verify_mode" value="command" checked /> command</label>
          <label class="chk"><input type="checkbox" name="verify_mode" value="llm" /> llm</label>
          <label class="chk"><input type="checkbox" name="verify_mode" value="manual" /> manual</label>
        </div>
        <label>驗收標準 Rubric（llm／manual 用，怎樣算「完成」）<textarea name="verify_rubric" rows="3" placeholder="例如：介面能正確顯示…" autocomplete="off"></textarea></label>
        <label>需要的硬體/環境 Requires（逗號分隔，本機不具備時自動轉手動驗證）<input name="requires" placeholder="gpu, camera, os:windows" autocomplete="off" /></label>
        <div class="row" id="repo-row">
          <label>Repo path <input name="repo_path" placeholder="/path/to/repo" autocomplete="off" /></label>
          <label>Base branch <input name="base_branch" placeholder="main" autocomplete="off" /></label>
        </div>
        <p class="dialog-hint" id="repo-hint" hidden>generic 工具在獨立的產出目錄執行，不需要 repo/base（無 git）。</p>
        <label>Setup cmd <input name="setup_cmd" placeholder="npm ci" autocomplete="off" /></label>
        <label>Environment（選填，套用對應 env:&lt;name&gt; 知識；亦為 deploy 任務的目標）
          <input name="environment" list="env-list" placeholder="company / home" autocomplete="off" />
          <datalist id="env-list"></datalist>
        </label>
        <menu>
          <button class="btn" type="button" id="new-cancel">取消</button>
          <button value="create" class="btn primary" id="create-btn" type="submit">建立</button>
        </menu>
      </form>
    </dialog>

    <dialog id="settings-dialog">
      <form id="settings-form" method="dialog">
        <h3>排程設定</h3>
        <p class="dialog-hint">門檻為用量百分比。儲存後立即生效（下一個 tick，免重啟）。</p>

        <div class="settings-group">日間</div>
        <label>日間時段 (HH:MM-HH:MM)<input name="day_window" placeholder="08:00-23:00" autocomplete="off" /></label>
        <div class="row">
          <label>Session 上限 %<input name="day_session_max" type="number" min="0" max="100" /></label>
          <label>Weekly 上限 %<input name="day_weekly_max" type="number" min="0" max="100" /></label>
        </div>

        <div class="settings-group">夜間</div>
        <div class="row">
          <label>Session 上限 %<input name="night_session_max" type="number" min="0" max="100" /></label>
          <label>Weekly 上限 %<input name="night_weekly_max" type="number" min="0" max="100" /></label>
        </div>

        <div class="settings-group">保護與排程</div>
        <div class="row">
          <label>硬上限 %（斷路器）<input name="hard_limit_pct" type="number" min="0" max="100" /></label>
          <label>最少 runway（分）<input name="min_runway_min" type="number" min="0" /></label>
          <label>並發數<input name="max_concurrency" type="number" min="0" /></label>
        </div>

        <div class="settings-group">Git 收尾</div>
        <div class="row">
          <label>fetch 最新 base
            <select name="git_fetch_base"><option value="true">開</option><option value="false">關</option></select>
          </label>
          <label>推送分支備份
            <select name="auto_push_branch"><option value="true">開</option><option value="false">關</option></select>
          </label>
        </div>
        <div class="row">
          <label>自動併入 base
            <select name="auto_merge"><option value="true">開</option><option value="false">關</option></select>
          </label>
          <label>衝突自動建任務
            <select name="merge_conflict_task"><option value="true">開</option><option value="false">關</option></select>
          </label>
        </div>

        <div class="settings-group">執行模型</div>
        <label>Coding 預設模型（未指定的任務都用它，越貴越燒 token）
          <select name="default_model">
            <option value="sonnet">sonnet（推薦，省 token）</option>
            <option value="haiku">haiku（最省）</option>
            <option value="opus">opus（更強）</option>
            <option value="fable-5">fable-5（最強，最貴）</option>
            <option value="default">CLI 預設</option>
            <optgroup label="本地模型（vLLM，不耗 token）" id="default-model-local-group" hidden></optgroup>
          </select>
        </label>

        <div class="settings-group">本地模型（vLLM）</div>
        <label>啟用本地模型（Model 選 local:… 的任務交給 Spark 上的 vLLM + opencode 執行，不耗 Anthropic token；關閉時這類任務停在佇列）
          <select name="local_models_enabled"><option value="false">關</option><option value="true">開</option></select>
        </label>
        <label>本地模型同時執行數（同一時間 GPU 只載一個模型） <input name="local_max_concurrency" type="number" min="1" max="8" /></label>
        <label>本地模型任務時段（HH:MM-HH:MM，可跨午夜，例如 19:00-07:00；留空＝任何時間。時段外不開新任務，跑到一半的會跑完）
          <input name="local_task_window" placeholder="19:00-07:00" autocomplete="off" data-clearable />
        </label>

        <div class="settings-group">晨報</div>
        <label>每天推送晨報的時間（HH:MM，經 ntfy；留空＝不推送，晨報頁照常可看）
          <input name="morning_report_time" placeholder="08:00" autocomplete="off" data-clearable />
        </label>

        <div class="settings-group">執行紀律（實驗性）</div>
        <label>派工時附加「執行紀律」提示區塊（TDD／系統化除錯／完成前驗證；預設關，效果見儀表板 A/B 表）
          <select name="prompt_discipline"><option value="false">關</option><option value="true">開</option></select>
        </label>

        <p class="settings-err" id="settings-err" hidden></p>
        <menu>
          <button class="btn" type="button" id="settings-cancel">取消</button>
          <button value="save" class="btn primary" id="settings-save" type="submit">儲存</button>
        </menu>
      </form>
    </dialog>

    <dialog id="prune-dialog">
      <form id="prune-form" method="dialog">
        <h3>清理任務</h3>
        <p class="dialog-hint">永久刪除終態任務與其磁碟產物（worktree／plan／logs）。不會動到執行中、blocked 或待結案（review）的任務。</p>

        <div class="settings-group">狀態</div>
        <div class="chk-row">
          <label class="chk"><input type="checkbox" name="status" value="closed" checked /> closed</label>
          <label class="chk"><input type="checkbox" name="status" value="failed" checked /> failed</label>
        </div>

        <label>只清理 N 天前更新的（留空 = 不限）<input name="older_than" type="number" min="0" placeholder="例如 7" autocomplete="off" /></label>

        <p class="prune-result" id="prune-result" hidden></p>
        <p class="settings-err" id="prune-err" hidden></p>
        <menu>
          <button class="btn" type="button" id="prune-cancel">取消</button>
          <button class="btn" type="button" id="prune-preview">預覽</button>
          <button class="btn danger" type="button" id="prune-run">清理</button>
        </menu>
      </form>
    </dialog>

    <dialog id="detail-dialog">
      <div id="detail-body"></div>
    </dialog>

    <script src="/ops.js"></script>
    <script src="/app.js"></script>
    <script type="module" src="/board-flow.js"></script>
  </body>
</html>
